<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>アイコンセットの比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
<style>
  :root { --bg: #f5f5f7; --cell: #fff; --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #aeaeb2; --sep: rgba(60,60,67,.18); --blue: #0a66ff; --red: #e5484d; --purple: #7c5cff; --amber: #d98b00; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 36px 80px; background: var(--bg); color: var(--ink); font-family: "Inter", "Noto Sans JP", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 14px; font-weight: 600; margin: 36px 0 10px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 24px; max-width: 900px; line-height: 1.6; }
  table { border-collapse: collapse; background: var(--cell); border-radius: 12px; overflow: hidden; border: 1px solid var(--sep); }
  th, td { padding: 12px 14px; text-align: center; border-top: 1px solid var(--sep); font-size: 11.5px; color: var(--ink2); }
  th { font-weight: 500; }
  thead th { border-top: 0; padding-top: 14px; }
  td.name, th.name { text-align: left; color: var(--ink); font-weight: 600; font-size: 13px; width: 210px; }
  td.name small { display: block; color: var(--ink2); font-weight: 400; font-size: 11.5px; margin-top: 2px; }
  td svg { width: 22px; height: 22px; display: block; margin: 0 auto; color: var(--ink); }
  td.name + td svg { color: var(--ink2); }
  .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .sample { background: var(--cell); border-radius: 12px; border: 1px solid var(--sep); padding: 18px 20px 12px; }
  .sample h3 { font-size: 12px; font-weight: 500; color: var(--ink2); margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--sep); }
  .row:first-of-type { border-top: 0; }
  .row .t { font-size: 15px; font-weight: 500; line-height: 1.4; }
  .row .t .tag { color: var(--ink2); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .row .m { font-size: 12.5px; color: var(--ink2); margin-top: 2px; display: flex; gap: 10px; align-items: center; font-feature-settings: "tnum"; }
  .row .m span { display: inline-flex; gap: 5px; align-items: center; }
  .row .r { font-size: 12.5px; color: var(--ink2); display: inline-flex; gap: 5px; align-items: center; }
  .row svg { width: 20px; height: 20px; color: var(--ink3); }
  .row .m svg, .row .r svg { width: 14px; height: 14px; color: currentColor; }
  .row.dim { opacity: .5; }
  .row.done .t { color: var(--ink3); text-decoration: line-through; }
  .row.done > svg { color: var(--blue); }
  .pri { color: var(--red); }
  .ai { color: var(--purple); }
  .wait { color: var(--amber); }
  .tools { display: flex; gap: 18px; padding: 14px 2px 2px; border-top: 1px solid var(--sep); margin-top: 6px; }
  .tools svg { width: 20px; height: 20px; color: var(--ink2); }
  .err { color: var(--red); font-size: 10px; }
</style>
</head>
<body>
<h1>アイコンセットの比較</h1>
<p class="lead">同じ 14 概念を 6 セットで。すべてオープンライセンス（MIT / ISC）で、SVG を直接読み込んでいる（CDN から取得。表示に数秒かかる）。線の太さ・角の丸み・視覚的な重さの一貫性、そして 20px での判読性を見る。</p>

<table id="grid"></table>

<h2>行部品の中で（有力 3 セット）</h2>
<div class="rows" id="rows"></div>

<script>
const CONCEPTS = [
  ["未完了", "circle"], ["完了", "check"], ["追加", "plus"], ["期限", "calendar"], ["後で", "moon"],
  ["相手待ち", "hourglass"], ["エージェント", "sparkle"], ["未整理", "inbox"], ["ボード", "kanban"],
  ["検索", "search"], ["コメント", "comment"], ["開く", "external"], ["次へ", "chevron"], ["設定", "settings"],
];

// 各セットの CDN パスと概念→ファイル名の対応
const SETS = [
  { name: "Lucide", note: "ISC · 線 2px（1.5–1.75 に調整可）· 24 grid", base: "https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/", ext: ".svg",
    map: { circle: "circle", check: "circle-check", plus: "plus", calendar: "calendar", moon: "moon", hourglass: "hourglass", sparkle: "sparkles", inbox: "inbox", kanban: "kanban", search: "search", comment: "message-square", external: "external-link", chevron: "chevron-right", settings: "settings" } },
  { name: "Phosphor Light", note: "MIT · 6 ウェイト · 256 grid · Apple 的な軽さ", base: "https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/light/", ext: "-light.svg",
    map: { circle: "circle", check: "check-circle", plus: "plus", calendar: "calendar-blank", moon: "moon", hourglass: "hourglass", sparkle: "sparkle", inbox: "tray", kanban: "kanban", search: "magnifying-glass", comment: "chat-circle", external: "arrow-square-out", chevron: "caret-right", settings: "gear" } },
  { name: "Phosphor Regular", note: "同上の標準ウェイト", base: "https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/regular/", ext: ".svg",
    map: { circle: "circle", check: "check-circle", plus: "plus", calendar: "calendar-blank", moon: "moon", hourglass: "hourglass", sparkle: "sparkle", inbox: "tray", kanban: "kanban", search: "magnifying-glass", comment: "chat-circle", external: "arrow-square-out", chevron: "caret-right", settings: "gear" } },
  { name: "Fluent System (Regular)", note: "MIT · Microsoft · Windows 11 の純正アイコン · 20 grid", base: "https://cdn.jsdelivr.net/npm/@fluentui/svg-icons@1.1.261/icons/", ext: "_20_regular.svg",
    map: { circle: "circle", check: "checkmark_circle", plus: "add", calendar: "calendar_ltr", moon: "weather_moon", hourglass: "hourglass", sparkle: "sparkle", inbox: "mail_inbox", kanban: "board", search: "search", comment: "comment", external: "open", chevron: "chevron_right", settings: "settings" } },
  { name: "Heroicons Outline", note: "MIT · Tailwind · 線 1.5px · 24 grid", base: "https://cdn.jsdelivr.net/npm/heroicons@2.1.5/24/outline/", ext: ".svg",
    map: { circle: "minus-circle", check: "check-circle", plus: "plus", calendar: "calendar", moon: "moon", hourglass: "clock", sparkle: "sparkles", inbox: "inbox", kanban: "view-columns", search: "magnifying-glass", comment: "chat-bubble-left", external: "arrow-top-right-on-square", chevron: "chevron-right", settings: "cog-6-tooth" } },
  { name: "Tabler", note: "MIT · 線 2px · 24 grid · 5,000 種", base: "https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/", ext: ".svg",
    map: { circle: "circle", check: "circle-check", plus: "plus", calendar: "calendar", moon: "moon", hourglass: "hourglass", sparkle: "sparkles", inbox: "inbox", kanban: "layout-kanban", search: "search", comment: "message", external: "external-link", chevron: "chevron-right", settings: "settings" } },
];

const cache = new Map();
async function svg(set, concept) {
  const url = set.base + set.map[concept] + set.ext;
  if (!cache.has(url)) cache.set(url, fetch(url).then((r) => (r.ok ? r.text() : Promise.reject(r.status))).catch((e) => `<span class="err">${set.map[concept]}: ${e}</span>`));
  let s = await cache.get(url);
  // 色を currentColor に正規化、サイズ属性を外す
  s = s.replace(/fill="(#[0-9a-fA-F]{3,6}|black|#000)"/g, 'fill="currentColor"').replace(/stroke="(#[0-9a-fA-F]{3,6}|black|#000)"/g, 'stroke="currentColor"')
       .replace(/\s(width|height)="[^"]*"/g, "");
  if (set.name === "Lucide" || set.name === "Tabler") s = s.replace(/stroke-width="2"/, 'stroke-width="1.75"');
  return s;
}

(async () => {
  const grid = document.getElementById("grid");
  grid.innerHTML = `<thead><tr><th class="name"></th>${CONCEPTS.map(([n]) => `<th>${n}</th>`).join("")}</tr></thead><tbody></tbody>`;
  const tb = grid.querySelector("tbody");
  for (const set of SETS) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="name">${set.name}<small>${set.note}</small></td>` + CONCEPTS.map(() => "<td></td>").join("");
    tb.appendChild(tr);
    const cells = [...tr.querySelectorAll("td")].slice(1);
    await Promise.all(CONCEPTS.map(async ([, c], i) => { cells[i].innerHTML = await svg(set, c); }));
  }

  const rows = document.getElementById("rows");
  for (const set of SETS.filter((s) => ["Lucide", "Phosphor Light", "Fluent System (Regular)"].includes(s.name))) {
    const I = async (c) => svg(set, c);
    const el = document.createElement("div");
    el.className = "sample";
    el.innerHTML = `<h3>${set.name}</h3>
      <div class="row">${await I("circle")}<div><div class="t"><span class="pri">!</span> メールを送る<span class="tag">DBJ</span></div><div class="m"><span>${await I("calendar")}今日</span></div></div><div class="r"></div></div>
      <div class="row">${await I("circle")}<div><div class="t">事前相談のアジェンダを用意する<span class="tag">JICA</span></div><div class="m"><span>${await I("check")}1 / 3</span></div></div><div class="r">${await I("calendar")}9/19</div></div>
      <div class="row">${await I("circle")}<div><div class="t"><span class="pri">!</span> スライド作成スキルを更新する<span class="tag">pc2</span></div><div class="m"><span class="ai">${await I("sparkle")}エージェントが調査中</span></div></div><div class="r"></div></div>
      <div class="row dim">${await I("circle")}<div><div class="t">NDA の Admin 対応を待って進める<span class="tag">信越</span></div><div class="m"><span class="wait">${await I("hourglass")}Admin の返答待ち</span><span>${await I("moon")}9/22</span></div></div><div class="r"></div></div>
      <div class="row done">${await I("check")}<div><div class="t">Task Board の動作確認</div></div><div class="r">9/16</div></div>
      <div class="tools">${await I("plus")}${await I("inbox")}${await I("kanban")}${await I("search")}${await I("comment")}${await I("external")}${await I("settings")}</div>`;
    rows.appendChild(el);
  }
})();
</script>
</body>
</html>
