<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Task Board</title>
  <meta name="description" content="GitHub Issues を正本にした、受信箱と AI への指示を持つ個人用タスクボード" />
  <meta name="theme-color" content="#f0f0f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="ナビゲーション">
      <div class="side-top">
        <button type="button" class="repo" id="repo-button" title="設定"><span id="repo-name">—</span></button>
        <span class="side-tools">
          <button type="button" class="ib" id="refresh-button" title="再読み込み" aria-label="再読み込み"><i data-icon="arrow-clockwise" class="m"></i></button>
          <button type="button" class="ib" id="settings-button" title="設定" aria-label="設定"><i data-icon="gear" class="m"></i></button>
        </span>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot"><button type="button" class="linkbtn" id="palette-button"><kbd>Ctrl</kbd>+<kbd>K</kbd> コマンド / 指示</button></div>
    </aside>

    <main class="main" id="main">
      <header class="hdr">
        <div class="hdr-l">
          <button type="button" class="ib only-narrow" id="menu-button" aria-label="メニュー"><i data-icon="stack" class="m"></i></button>
          <h2 id="view-title">受信箱</h2>
          <div class="tabs" id="tabs" role="tablist"></div>
        </div>
        <div class="hdr-r">
          <label class="search"><i data-icon="magnifying-glass" class="s"></i><input id="search" type="search" placeholder="絞り込み" autocomplete="off" aria-label="絞り込み" /><kbd>/</kbd></label>
          <button type="button" class="btn" id="intake-button" title="テキストを貼ってまとめてタスク化"><i data-icon="clipboard-text" class="m"></i><span class="wide-only">まとめて</span></button>
          <button type="button" class="btn pri2" id="new-button" title="新規（N）"><i data-icon="plus" class="m"></i><span class="wide-only">新規</span><kbd>N</kbd></button>
        </div>
      </header>
      <div class="notice" id="notice" hidden></div>
      <div class="view" id="view" tabindex="-1"></div>
      <footer class="status" id="status-keys"></footer>
    </main>

    <aside class="panel" id="panel" aria-label="詳細" tabindex="-1">
      <button type="button" class="ib only-narrow panel-close" id="panel-close" aria-label="閉じる"><i data-icon="x" class="m"></i></button>
      <div class="p-body" id="panel-body"></div>
      <div class="ask" id="ask" hidden>
        <div class="in" id="ask-in"><i data-icon="sparkle" class="m"></i><div class="ask-slot" id="ask-slot"></div><kbd class="ask-key">I</kbd></div>
        <div id="ask-box"></div>
        <div class="hint" id="ask-hint"></div>
      </div>
    </aside>
  </div>

  <div class="popover" id="popover" hidden role="menu"></div>
  <div class="palette" id="palette" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="dialog" id="intake-dialog"></dialog>

  <dialog class="dialog" id="settings-dialog">
    <form method="dialog" class="dlg" id="settings-form">
      <h2>設定</h2>
      <p class="lead">タスクは GitHub Issues として保存されます。Fine-grained personal access token（対象リポジトリの Issues: Read and write）を用意してください。</p>
      <label class="field"><span>リポジトリ</span><input id="cfg-repo" type="text" placeholder="owner/repo" spellcheck="false" required /></label>
      <label class="field" id="cfg-token-field"><span>Personal access token</span><input id="cfg-token" type="password" placeholder="github_pat_…" spellcheck="false" autocomplete="off" /></label>
      <p class="hint" id="cfg-token-hint">トークンはこの端末のブラウザ内にのみ保存されます。</p>
      <div class="msg" id="cfg-message" hidden></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="cfg-cancel">閉じる</button>
        <button type="button" class="btn pri2" id="cfg-save">接続して保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
